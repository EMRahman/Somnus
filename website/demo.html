<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Somnus interactive demo</title>
  <link rel="stylesheet" href="demo.css">
  <script src="demo-data.js" defer></script>
  <script src="demo.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="status-bar" aria-label="iPhone status bar, 9:41 AM">
      <span class="status-time">9:41</span>
      <span class="status-demo" aria-label="Fictional demo data">DEMO</span>
      <span class="status-icons" aria-hidden="true"><svg viewBox="0 0 18 14"><path d="M1 12V9h2v3zm4 0V6h2v6zm4 0V3h2v9zm4 0V0h2v12z" fill="currentColor"/></svg><svg viewBox="0 0 18 14"><path d="M1 4Q9-2 17 4M4 7q5-4 10 0M7 10q2-2 4 0" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="9" cy="12" r="1.3" fill="currentColor"/></svg><svg class="battery" viewBox="0 0 28 14"><rect x="1" y="1" width="23" height="12" rx="3" fill="none" stroke="currentColor" opacity=".6"/><rect x="3" y="3" width="19" height="8" rx="1.4" fill="currentColor"/><path d="M26 5v4" stroke="currentColor" stroke-width="2"/></svg></span>
    </header>
    <main id="app-content" class="app-content" aria-label="Dashboard" tabindex="-1"></main>
    <nav class="tab-bar" aria-label="Somnus screens">
      <button class="tab active" data-tab="dashboard" aria-current="page"><span data-icon="moon"></span><span>Dashboard</span></button>
      <button class="tab" data-tab="trends"><span data-icon="trends"></span><span>Trends</span></button>
      <button class="tab" data-tab="settings"><span data-icon="settings"></span><span>Settings</span></button>
    </nav>
    <div class="home-indicator" aria-hidden="true"></div>
  </div>
  <dialog id="info-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-done">Done</button></div><div id="dialog-body"></div></dialog>
  <noscript><p class="no-script">Enable JavaScript to explore the interactive Somnus demo.</p></noscript>
</body>
</html>
