name: Somnus
options:
  bundleIdPrefix: com.somnus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "FXNHMJHQFS"

targets:
  Somnus:
    type: application
    platform: iOS
    sources:
      - path: Somnus
    settings:
      base:
        INFOPLIST_FILE: Somnus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Somnus/Somnus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.ehsanrahman.somnus
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: "YES"
    entitlements:
      path: Somnus/Somnus.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies: []
    scheme:
      testTargets:
        - SomnusTests
        - SomnusUITests
      gatherCoverageData: false

  SomnusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SomnusTests
    dependencies:
      - target: Somnus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ehsanrahman.somnus.tests

  SomnusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SomnusUITests
    dependencies:
      - target: Somnus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ehsanrahman.somnus.uitests
